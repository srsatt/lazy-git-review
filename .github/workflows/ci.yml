name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.96.0
          components: clippy,rustfmt
      - name: Install real language servers
        run: ./scripts/install-lsp-test-dependencies.sh .ci-lsp
      - name: Install Neovim 0.12.4
        run: |
          curl -fsSL -o /tmp/nvim.tar.gz https://github.com/neovim/neovim/releases/download/v0.12.4/nvim-linux-x86_64.tar.gz
          tar -C /tmp -xzf /tmp/nvim.tar.gz
          echo /tmp/nvim-linux-x86_64/bin >> "$GITHUB_PATH"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Test with real language servers
        env:
          LGR_LSP_BIN_DIR: ${{ github.workspace }}/.ci-lsp/node_modules/.bin
        run: cargo test --all-targets --locked
      - run: ./scripts/check-neovim.sh
