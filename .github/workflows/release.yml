name: release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.96.0
          components: clippy,rustfmt
      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | sed -n '1p')
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Install real language servers
        run: ./scripts/install-lsp-test-dependencies.sh .ci-lsp
      - name: Install Neovim 0.12.4
        run: |
          curl -fsSL -o /tmp/nvim.tar.gz https://github.com/neovim/neovim/releases/download/v0.12.4/nvim-linux-x86_64.tar.gz
          tar -C /tmp -xzf /tmp/nvim.tar.gz
          echo /tmp/nvim-linux-x86_64/bin >> "$GITHUB_PATH"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Test with real language servers
        env:
          LGR_LSP_BIN_DIR: ${{ github.workspace }}/.ci-lsp/node_modules/.bin
        run: cargo test --all-targets --locked
      - run: ./scripts/check-neovim.sh
      - name: Generate third-party licence report
        run: |
          cargo install cargo-about --version 0.9.2 --locked --features cli
          cargo about generate about.hbs --locked --fail --config about.toml --output-file THIRD_PARTY_LICENSES.html
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: third-party-license-report
          path: THIRD_PARTY_LICENSES.html
          if-no-files-found: error

  package:
    needs: quality
    strategy:
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.96.0
          targets: ${{ matrix.target }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: third-party-license-report
          path: .release
      - name: Package release
        env:
          LGR_THIRD_PARTY_REPORT: ${{ github.workspace }}/.release/THIRD_PARTY_LICENSES.html
        run: ./scripts/package.sh ${{ matrix.target }}
      - name: Verify archive and clean installation
        run: ./scripts/check-package.sh lazy-git-review-*-${{ matrix.target }}.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lazy-git-review-${{ matrix.target }}
          path: |
            lazy-git-review-*-${{ matrix.target }}.tar.gz
            lazy-git-review-*-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: lazy-git-review-*
          merge-multiple: true
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            lazy-git-review-*.tar.gz
            lazy-git-review-*.tar.gz.sha256
