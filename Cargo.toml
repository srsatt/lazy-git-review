[package]
name = "lazy-git-review"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Semantic change graph and ranked queue for code review"
license = "EUPL-1.2"
repository = "https://github.com/srsatt/lazy-git-review"
readme = "README.md"
keywords = ["git", "code-review", "neovim", "lsp"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "lgr"
path = "src/main.rs"

[dependencies]
async-lsp = { version = "0.2.2", features = ["client-monitor", "stdio", "tokio"] }
base64 = "0.22.1"
chrono = { version = "0.4.42", features = ["serde"] }
clap = { version = "4.5.48", features = ["derive"] }
crossterm = "0.29.0"
directories = "6.0.0"
futures = "0.3.31"
fs2 = "0.4.3"
globset = "0.4.16"
hex = "0.4.3"
libc = "0.2.176"
ignore = "0.4.23"
pulldown-cmark = "0.13.0"
pathdiff = "0.2"
ratatui = "0.29.0"
regex = "1.11.2"
rusqlite = { version = "0.37.0", features = ["bundled", "chrono"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
signal-hook = "0.3.18"
thiserror = "2.0.17"
tokio = { version = "1.47.1", features = ["macros", "process", "rt-multi-thread", "time", "io-util", "sync", "signal"] }
tokio-util = { version = "0.7.16", features = ["compat"] }
tree-sitter = "0.25.10"
tree-sitter-css = "0.25.0"
tree-sitter-highlight = "0.25.10"
tree-sitter-html = "0.23.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23.2"
unicode-width = "0.1.14"
uuid = { version = "1.18.1", features = ["serde", "v4"] }
walkdir = "2.5.0"

[dev-dependencies]
assert_cmd = "2.0.17"
predicates = "3.1.3"
tempfile = "3.23.0"

[profile.release]
lto = "thin"
strip = true
